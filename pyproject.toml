[project]
name = "parasphere-twin"
version = "0.1.0"
description = "The shared structure-twin schema: one file drives simulation, mission planning, coverage, and processing"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["parasphere_twin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=parasphere_twin --cov-report=term-missing --cov-fail-under=95"

[tool.ruff]
line-length = 100
